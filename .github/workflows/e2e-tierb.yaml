name: E2E Tier B (kind + real OSAC stack)

# The sole active E2E workflow for osac-service-provider
# (.ai/specs/osac-sp-e2e-tier-b.spec.md). Phase 1: real Postgres, real
# Keycloak (vendored realm, DD-150), and real fulfillment-service (pinned,
# published chart, DD-151), replacing the retired Phase A osac-mock-provider, to
# close the mock provider's structural auth-fidelity gap (Phase A never
# validates auth at all — see issue #21). Phase 2 (issue #44): real
# osac-operator + BMFO + osac-aap-mock, driving a real ClusterOrder CR to a
# real terminal state. Phase 2 uses a real environment-agent registration
# target and an in-cluster JetStream NATS broker; control-plane is not part of
# this Tier B stack.

on:
  push:
    branches: [main, 'release/v*', 'feat/e2e-tier-b-phase1']
  pull_request:
    branches: [main, 'release/v*']
  workflow_dispatch: {}

env:
  KIND_CLUSTER_NAME: osac-sp-e2e-tierb
  CERT_MANAGER_VERSION: v1.20.0
  FULFILLMENT_SERVICE_CHART_VERSION: "0.0.107" # REQ-TB-050 — pin, never `main`/`latest` (aligned with the v0.0.107 CLI and OSAC-4826 fix)
  FULFILLMENT_SERVICE_CLI_VERSION: "v0.0.107" # OSAC-4826 — `osac create hub --name` fix
  OSAC_OPERATOR_CHART_VERSION: "0.0.12" # REQ-TB-070 — pinned to the osac-project/osac monorepo's own release (DD-149)
  BMFO_CHART_VERSION: "0.0.12" # REQ-TB-070 — pinned to the osac-project/osac monorepo's own release (DD-149)

jobs:
  e2e-tierb:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # NFR-TB-010
    steps:
      - name: Checkout osac-service-provider
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build osac-service-provider image
        run: docker build -t osac-service-provider:e2e -f Containerfile .

      - name: Build osac-aap-mock image
        run: docker build -t osac-aap-mock:e2e -f Containerfile.osac-aap-mock .

      - name: Build environment-agent image
        run: |
          EA_VERSION=$(go -C test/e2e list -m -f '{{.Version}}' github.com/dcm-project/environment-agent)
          echo "Building github.com/dcm-project/environment-agent@${EA_VERSION}"
          CGO_ENABLED=0 GOOS=linux GOBIN="$PWD/.bin" go install "github.com/dcm-project/environment-agent/cmd/environment-agent@${EA_VERSION}"
          docker build -t environment-agent:e2e -f Containerfile.environment-agent .

      - name: Install fulfillment-service CLI
        run: |
          # The release module contains monorepo-local replace directives, so
          # `go install module@version` rejects it. Build the CLI from the
          # exact release tag with the replacement modules present instead.
          git clone --filter=blob:none --sparse --depth 1 \
            --branch "fulfillment-service/${{ env.FULFILLMENT_SERVICE_CLI_VERSION }}" \
            https://github.com/osac-project/osac.git "$RUNNER_TEMP/osac"
          git -C "$RUNNER_TEMP/osac" sparse-checkout set \
            fulfillment-service bare-metal-fulfillment-operator osac-operator/api proto
          GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=auto GOWORK=off \
            go -C "$RUNNER_TEMP/osac/fulfillment-service" install ./cmd/osac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: test/e2e/kind-config.yaml
          wait: 120s

      - name: Load osac-service-provider image into kind
        run: kind load docker-image osac-service-provider:e2e --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Load osac-aap-mock image into kind
        run: kind load docker-image osac-aap-mock:e2e --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Load environment-agent image into kind
        run: kind load docker-image environment-agent:e2e --name "${{ env.KIND_CLUSTER_NAME }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # --- cert-manager (DD-151: hard prerequisite of fulfillment-service's chart, all variants) ---
      - name: Install cert-manager
        run: |
          helm upgrade cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --install --version "${{ env.CERT_MANAGER_VERSION }}" \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true --wait

      - name: Create self-signed CA chain (mirrors fulfillment-service/docs/INSTALL.md)
        run: |
          kubectl apply -f test/e2e/manifests-tierb/cert-manager-ca.yaml
          kubectl wait --for=condition=Ready certificate/osac-ca -n cert-manager --timeout=60s

      - name: Copy CA cert into a `ca-bundle` ConfigMap (stands in for trust-manager)
        run: |
          kubectl get secret osac-ca -n cert-manager -o go-template='{{ index .data "tls.crt" | base64decode }}' > /tmp/ca.pem
          kubectl create configmap ca-bundle --from-file=bundle.pem=/tmp/ca.pem

      # --- ffs-postgres ---
      - name: Deploy ffs-postgres
        run: |
          kubectl apply -f test/e2e/manifests-tierb/postgres.yaml
          kubectl rollout status deployment/ffs-postgres --timeout=2m

      # --- ffs-keycloak (real Keycloak, vendored realm — DD-150) ---
      - name: Create ffs-keycloak-realm ConfigMap from the vendored realm.json
        run: kubectl create configmap ffs-keycloak-realm --from-file=realm.json=test/e2e/tierb-config/realm.json

      - name: Deploy ffs-keycloak
        run: |
          kubectl apply -f test/e2e/manifests-tierb/keycloak.yaml
          kubectl rollout status deployment/ffs-keycloak --timeout=3m

      # --- ffs-fulfillment-service (real, published chart — DD-151) ---
      - name: Deploy fulfillment-service secrets
        run: kubectl apply -f test/e2e/manifests-tierb/fulfillment-secrets.yaml

      - name: Install fulfillment-service
        run: |
          set -o pipefail
          # The chart unconditionally renders Gateway API `TLSRoute`
          # objects for its ingress-proxy, even though nothing in this
          # workflow needs external/TLS-terminated ingress — osac-sp talks
          # to fulfillment-grpc-server in-cluster. Installing the Gateway
          # API CRDs just to satisfy `helm install`'s CRD-existence check
          # pulls in a dependency (and a `v1alpha3` vs. this cluster's
          # `v1alpha2` version mismatch, confirmed via a live spike) with
          # no corresponding controller to ever reconcile the resource —
          # so render+filter+apply instead of `helm install`, dropping
          # only the `TLSRoute` kind. Everything else in the chart
          # (Deployments/Services/Certificates/etc.) is applied as-is.
          # `helm template`'s OCI pull status ("Pulled: ...", "Digest:
          # ...") lands on stdout or stderr depending on the installed
          # Helm build (confirmed empirically: this repo's local Helm
          # v4.1.1 writes it to stderr, but `azure/setup-helm@v4`'s
          # "latest" resolves to a build that writes it to stdout) — so
          # redirecting stderr away isn't a reliable fix by itself.
          # Strip both lines by content instead, whichever stream they
          # land on, before handing the file to yq/kubectl: left as-is,
          # they render as a bogus leading YAML document with no
          # apiVersion/kind, which kubectl apply rejects outright.
          helm template ffs-fulfillment-service oci://ghcr.io/osac-project/charts/fulfillment-service \
            --version "${{ env.FULFILLMENT_SERVICE_CHART_VERSION }}" \
            --values test/e2e/tierb-config/fulfillment-service-values.yaml \
            2>&1 | grep -Ev '^(Pulled|Digest): ' > /tmp/ffs-rendered.yaml
          # `select(. != null)` additionally guards against a real,
          # separate finding: some of the chart's templates emit a
          # `---\n# Source: ...` separator with no body for a
          # conditionally-skipped block, which yq would otherwise pass
          # through as a null document.
          yq eval-all 'select(. != null) | select(.kind != "TLSRoute")' /tmp/ffs-rendered.yaml \
            > /tmp/ffs-rendered-filtered.yaml
          kubectl apply -f /tmp/ffs-rendered-filtered.yaml || {
            echo "::group::triage: filtered manifest, full content"
            cat -A /tmp/ffs-rendered-filtered.yaml
            echo "::endgroup::"
            exit 1
          }
          # Only wait on what osac-sp's health check actually exercises
          # (fulfillment-grpc-server's Capabilities service) — the chart's
          # Deployments carry no common selector label to wait on as a
          # group, and fulfillment-console-proxy (an interactive web
          # console frontend, unrelated to gRPC health) was observed
          # flaky/not-ready in a live spike with no bearing on this suite.
          kubectl wait --for=condition=Available deployment/fulfillment-grpc-server --timeout=5m

      # --- environment-agent + NATS (DD-203) ---
      - name: Deploy NATS (JetStream)
        run: |
          kubectl apply -f test/e2e/manifests-tierb/nats.yaml
          kubectl rollout status deployment/nats --timeout=120s

      - name: Deploy environment-agent
        run: |
          kubectl apply -f test/e2e/manifests-tierb/environment-agent.yaml
          kubectl rollout status deployment/environment-agent --timeout=180s

      # --- osac-service-provider, wired at the real OSAC stack ---
      - name: Apply osac-service-provider (Tier B wiring)
        run: kubectl apply -f test/e2e/manifests-tierb/osac-service-provider.yaml

      - name: Wait for osac-sp readiness
        run: kubectl wait --for=condition=Available deployment/osac-service-provider --timeout=180s

      # --- Phase 2: real osac-operator + BMFO + osac-aap-mock (REQ-TB-070..100) ---
      - name: Install vendored CRDs (ClusterOrder, HostedCluster, NodePool, Tenant, BareMetalInstance, BareMetalPool, ComputeInstance, BareMetalHost)
        run: kubectl apply -f test/e2e/manifests-tierb/crds/

      - name: Deploy BMFO stub secrets (DD-217)
        run: kubectl apply -f test/e2e/manifests-tierb/bmfo-secrets.yaml

      - name: Install osac-operator
        run: |
          helm install osac-operator oci://ghcr.io/osac-project/charts/osac-operator \
            --version "${{ env.OSAC_OPERATOR_CHART_VERSION }}" \
            --values test/e2e/tierb-config/osac-operator-values.yaml
          kubectl rollout status deployment/osac-operator --timeout=3m

      - name: Fill osac-operator's hub-access-hosted-clusters RBAC gap (DD-223)
        run: kubectl apply -f test/e2e/manifests-tierb/hub-access-hosted-clusters-rbac.yaml

      - name: Register Hub (TC-TB-200)
        run: |
          kubectl port-forward svc/fulfillment-internal-api 18083:8001 >/tmp/pf-fulfillment-internal-api.log 2>&1 &
          echo $! > /tmp/pf-fulfillment-internal-api.pid
          sleep 3

          # kind's kubeconfig points at the host-side API address. The Hub
          # controller consumes this file from inside the cluster, so replace
          # the loopback endpoint with the in-cluster Kubernetes Service DNS.
          kubectl config view --raw --minify \
             | sed -E 's#server: https://127\.0\.0\.1:[0-9]+#server: https://kubernetes.default.svc#' \
            > /tmp/tierb-hub-kubeconfig

          printf '%s' tierb-osac-admin-secret > /tmp/tierb-osac-client-secret
          OSAC_TOKEN="$(curl --fail --silent --show-error --insecure \
            --connect-to ffs-keycloak:8443:127.0.0.1:18443 \
            --request POST https://ffs-keycloak:8443/realms/osac/protocol/openid-connect/token \
            --data-urlencode client_id=osac-admin \
            --data-urlencode client_secret@/tmp/tierb-osac-client-secret \
            --data-urlencode grant_type=client_credentials \
            | jq --exit-status --raw-output '.access_token')"
          export OSAC_TOKEN
          osac login --insecure --private https://127.0.0.1:18083
           osac create hub \
             --name default-hub \
             --kubeconfig /tmp/tierb-hub-kubeconfig \
             --namespace default
           osac create -f test/e2e/manifests-tierb/cluster-dispatch-fixture.yaml
           # ClusterVersion.spec.image is private-only, so create it through
           # the private CLI command rather than the public object loader.
           osac create clusterversion \
             --name tierb-1-29 \
             --version 1.29.0 \
             --image quay.io/openshift-release-dev/ocp-release:4.16.0-multi \
             --enabled \
             --default \
             --state ACTIVE

      - name: Install bare-metal-fulfillment-operator (deploy-only, TC-TB-100 — DD-216)
        run: |
          helm install bmf-operator oci://ghcr.io/osac-project/charts/bare-metal-fulfillment-operator \
            --version "${{ env.BMFO_CHART_VERSION }}"
          kubectl rollout status deployment/bmf-operator-controller-manager --timeout=3m

      - name: Deploy osac-aap-mock
        run: |
          kubectl apply -f test/e2e/manifests-tierb/aap-mock.yaml
          kubectl rollout status deployment/osac-aap-mock --timeout=2m

      - name: Start port-forwards
        run: |
          kubectl port-forward svc/osac-service-provider 18081:8080 >/tmp/pf-osac-sp.log 2>&1 &
          echo $! > /tmp/pf-osac-sp.pid
          kubectl port-forward svc/ffs-keycloak 18082:8443 >/tmp/pf-keycloak.log 2>&1 &
          echo $! > /tmp/pf-keycloak.pid
          kubectl port-forward svc/environment-agent 18090:8090 >/tmp/pf-environment-agent.log 2>&1 &
          echo $! > /tmp/pf-environment-agent.pid
          sleep 3

      - name: Run Tier B e2e suite
        env:
          OSAC_SP_URL: http://localhost:18081
          FULFILLMENT_INTERNAL_ADDRESS: 127.0.0.1:18083
          KEYCLOAK_URL: https://localhost:18082/realms/osac
          TIERB_ADMIN_SECRET: tierb-osac-admin-secret
          ENVIRONMENT_AGENT_URL: http://127.0.0.1:18090/api/v1alpha1
          TIERB_PHASE2_ENABLED: "true"
        run: make e2e-test

      - name: Stop port-forwards
        if: always()
        run: |
          for f in /tmp/pf-osac-sp.pid /tmp/pf-keycloak.pid /tmp/pf-environment-agent.pid /tmp/pf-fulfillment-internal-api.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/e2e-diagnostics
          kubectl get pods -o wide > /tmp/e2e-diagnostics/pods.txt 2>&1 || true
          kubectl get certificates,issuers,clusterissuers -A > /tmp/e2e-diagnostics/certs.txt 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp > /tmp/e2e-diagnostics/events.txt 2>&1 || true
          kubectl get clusterorder tierb-cluster-order -o yaml > /tmp/e2e-diagnostics/clusterorder.yaml 2>&1 || true
          for d in nats environment-agent osac-service-provider ffs-postgres ffs-keycloak osac-operator bare-metal-fulfillment-operator osac-aap-mock; do
            kubectl logs -l "app.kubernetes.io/name=${d}" --all-containers --prefix --tail=-1 > "/tmp/e2e-diagnostics/${d}.log" 2>&1 || true
          done
          kubectl logs -l "app.kubernetes.io/instance=ffs-fulfillment-service" --all-containers --prefix --tail=-1 > /tmp/e2e-diagnostics/ffs-fulfillment-service.log 2>&1 || true
          cat /tmp/pf-*.log > /tmp/e2e-diagnostics/port-forward.log 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tierb-diagnostics
          path: /tmp/e2e-diagnostics

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${{ env.KIND_CLUSTER_NAME }}"
