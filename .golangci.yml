version: "2"
run:
  modules-download-mode: readonly

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: disable

linters:
  exclusions:
    paths:
      - api/v1alpha1
      - pkg/client
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - decorder
    - dogsled
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gocyclo
    - goconst
    - goprintffuncname
    - gosec
    - grouper
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - makezero
    - mirror
    - misspell
    - nestif
    - nilerr
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    staticcheck:
      checks:
        - all
        - -ST1003 # https://staticcheck.dev/docs/checks/#ST1003 Poorly chosen identifier.
        - -QF1008 # https://staticcheck.dev/docs/checks/#QF1008 Omit embedded fields from selector expression.
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: unused-parameter
    exhaustive:
      # A switch with an explicit default is exhaustive by convention here
      # (e.g. internal/grpcerror.Classify's gRPC-code table) — do not force
      # every enum member to be spelled out when a catch-all default is the
      # documented, intended design.
      default-signifies-exhaustive: true
    goconst:
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50

issues:
  max-issues-per-linter: 0
  max-same-issues: 0