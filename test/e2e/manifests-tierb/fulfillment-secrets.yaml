# Secrets consumed by fulfillment-service-values.yaml's `auth.controllerCredentials`,
# `idp.credentials`, and `database.connection` (DD-146). Static/test-only
# values (NFR-TB-020) — matches tierb-config/realm.json's osac-controller
# client secret and ffs-postgres's static password.
apiVersion: v1
kind: Secret
metadata:
  name: ffs-controller-credentials
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  client-id: "osac-controller"
  client-secret: "tierb-osac-controller-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: ffs-database-credentials
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  url: "postgres://postgres:tierb-postgres-password@ffs-postgres:5432/service?sslmode=disable"
  user: "postgres"
  password: "tierb-postgres-password"
