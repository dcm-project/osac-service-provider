# osac-aap-mock (REQ-TB-080, Phase 2): this repo's own binary, faking just
# enough of AAP's REST surface for real osac-operator/BMFO reconciliation
# to reach a terminal state (DD-212/213). Same manifest style as
# postgres.yaml — a plain Deployment+Service, no chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osac-aap-mock
  labels:
    app.kubernetes.io/name: osac-aap-mock
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osac-aap-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osac-aap-mock
    spec:
      containers:
        - name: osac-aap-mock
          image: osac-aap-mock:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          env:
            - name: MOCK_AAP_ADDRESS
              value: ":9093"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: osac-aap-mock
  labels:
    app.kubernetes.io/name: osac-aap-mock
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
spec:
  selector:
    app.kubernetes.io/name: osac-aap-mock
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP
