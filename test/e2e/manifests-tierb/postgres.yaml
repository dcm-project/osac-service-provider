# ffs-postgres (REQ-TB-010): this repo's own plain manifest — a single
# Postgres instance backing both Keycloak's own database and
# fulfillment-service's `service` database (spec §2, Phase 1 architecture).
# The official postgres image only creates one database (POSTGRES_DB) at
# start; the second is created by an init script mounted into
# /docker-entrypoint-initdb.d/, the image's own documented extension point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ffs-postgres-init
  labels:
    app.kubernetes.io/name: ffs-postgres
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
data:
  init-service-db.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE service;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffs-postgres
  labels:
    app.kubernetes.io/name: ffs-postgres
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ffs-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ffs-postgres
    spec:
      containers:
        - name: postgres
          # fulfillment-service/docs/INSTALL.md: "The service requires a
          # PostgreSQL 18+ database" — confirmed the hard way via a live
          # spike (postgres:16 left grpc-server's migrator in a dirty,
          # crash-looping state; see DD-151 addendum).
          image: docker.io/library/postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "tierb-postgres-password"
            - name: POSTGRES_DB
              value: "keycloak"
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: ffs-postgres-init
            defaultMode: 0o755
---
apiVersion: v1
kind: Service
metadata:
  name: ffs-postgres
  labels:
    app.kubernetes.io/name: ffs-postgres
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
spec:
  selector:
    app.kubernetes.io/name: ffs-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
