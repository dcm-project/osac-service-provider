# Stub Secrets for BMFO's two non-optional chart volumes
# (`osac-inventory-config`/`osac-management-config`, DD-217). The chart's
# own deployment.yaml mounts the whole Secret at /etc/osac/inventory/ and
# /etc/osac/management/ with no `optional: true` and no `items`/subPath
# restriction, so the key names below (`inventory.yaml`/`management.yaml`,
# matching BMFO's own hardcoded default paths — cmd/main.go's
# envInventoryConfigPath/envManagementConfigPath) must exist verbatim, not
# just any non-empty Secret (DD-220 finding: an empty `config.yaml` key
# satisfies the volume mount but not `os.ReadFile("/etc/osac/inventory/
# inventory.yaml")`).
#
# `type: metal3` is used (not `bcm`/`openstack`) because it's the only one
# of BMFO's three inventory backends whose client constructor doesn't also
# require a live external endpoint to succeed — it only needs the
# `metal3.io/v1alpha1` API group discoverable (satisfied by this directory's
# fixture-grade baremetalhosts.metal3.io.yaml) and a namespace string.
#
# `options.metal3.namespace: default` is also where TC-TB-110/120's static
# `BareMetalHost` fixtures (baremetalhost-fixture-{unset,always}.yaml) live
# — FindFreeHost/AssignHost are exercised for real against them (DD-226/227:
# a live spike found BMFO's metal3 backend never needs a real Metal3/
# Ironic/virtual-BMC stack, only these Kubernetes objects). This config
# previously only needed to get BMFO's manager past startup (DD-216, before
# #46 landed) — now it's exercised end-to-end.
#
# `hostClass` is a required top-level field on BMFO's own inventory Config
# struct (`internal/inventory/client.go`), sibling to `type`/`options`, not
# nested under `options.metal3` (DD-228). Leaving it unset makes every
# `FindFreeHost`/`AssignHost` call return an empty `HostClass`, which
# `BareMetalInstanceReconciler.reconcileInventory` writes straight into
# `Spec.HostClass` — and `handleUpdate` dispatches to `reconcileInventory`
# vs. `reconcileManagement` based on `Spec.HostClass == ""`, so an
# empty-string round trip there means the reconciler can never leave
# `reconcileInventory`, forever re-running the (idempotent) assign-host
# steps and never reaching `Ready` (DD-231).
apiVersion: v1
kind: Secret
metadata:
  name: osac-inventory-config
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  inventory.yaml: |
    name: tierb-fixture-inventory
    type: metal3
    hostClass: tierb-fixture-hostclass
    options:
      metal3:
        namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: osac-management-config
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  management.yaml: |
    name: tierb-fixture-management
    type: metal3
    options:
      metal3:
        namespace: default
