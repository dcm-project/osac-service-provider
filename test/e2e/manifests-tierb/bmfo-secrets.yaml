# Stub Secrets for BMFO's two non-optional chart volumes
# (`osac-inventory-config`/`osac-management-config`, DD-216). The chart's
# own deployment.yaml mounts the whole Secret at /etc/osac/inventory/ and
# /etc/osac/management/ with no `optional: true` and no `items`/subPath
# restriction, so the key names below (`inventory.yaml`/`management.yaml`,
# matching BMFO's own hardcoded default paths — cmd/main.go's
# envInventoryConfigPath/envManagementConfigPath) must exist verbatim, not
# just any non-empty Secret (DD-219 finding: an empty `config.yaml` key
# satisfies the volume mount but not `os.ReadFile("/etc/osac/inventory/
# inventory.yaml")`).
#
# `type: metal3` is used (not `bcm`/`openstack`) because it's the only one
# of BMFO's three inventory backends whose client constructor doesn't also
# require a live external endpoint to succeed — it only needs the
# `metal3.io/v1alpha1` API group discoverable (satisfied by this directory's
# fixture-grade baremetalhosts.metal3.io.yaml) and a namespace string. No
# BareMetalHost objects need to exist: this phase never creates a
# BareMetalInstance CR, so FindFreeHost/AssignHost are never called (DD-215:
# terminal-state proof deferred to #46) — this config only needs to get
# BMFO's manager past startup into a Ready pod for TC-TB-100.
apiVersion: v1
kind: Secret
metadata:
  name: osac-inventory-config
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  inventory.yaml: |
    name: tierb-fixture-inventory
    type: metal3
    options:
      metal3:
        namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: osac-management-config
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  management.yaml: |
    name: tierb-fixture-management
    type: metal3
    options:
      metal3:
        namespace: default
