# Stub Secrets for BMFO's two non-optional chart volumes
# (`osac-inventory-config`/`osac-management-config`, DD-216). The chart's
# own deployment.yaml mounts these WITHOUT `optional: true` (unlike
# `clouds`/`profiles`/`bcm-certs`, all of which are optional) — without
# them, the controller-manager pod fails at mount time and never starts,
# regardless of whether any BareMetalInstance reconciliation is exercised
# (DD-215: it isn't, this phase). Content is irrelevant for this phase's
# scope: no inventory/management backend is configured (BMFO's own
# env.aapUrl chart value is left unset), so these are empty placeholders,
# not real BCM/inventory config.
apiVersion: v1
kind: Secret
metadata:
  name: osac-inventory-config
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  config.yaml: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: osac-management-config
  labels:
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
type: Opaque
stringData:
  config.yaml: ""
