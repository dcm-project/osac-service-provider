# CA chain for fulfillment-service's chart (DD-146: cert-manager is a hard
# chart prerequisite, all variants). Mirrors
# fulfillment-service/docs/INSTALL.md's own "Create the certificate
# authority" self-signed-root pattern exactly, minus the trust-manager
# `Bundle` step — trust-manager is optional per the chart's own README, and
# the workflow instead copies the CA cert into the `ca-bundle` ConfigMap
# directly (a one-line `kubectl create configmap --from-literal`), since
# installing a second operator just to avoid one kubectl command isn't
# worth it for a throwaway kind cluster.
#
# Requires cert-manager itself already installed (workflow step, before
# this manifest is applied).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  namespace: cert-manager
  name: osac-ca
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: cert-manager
  name: osac-ca
spec:
  commonName: OSAC CA
  isCA: true
  issuerRef:
    kind: Issuer
    name: osac-ca
  secretName: osac-ca
  privateKey:
    rotationPolicy: Always
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: osac-ca
spec:
  ca:
    secretName: osac-ca
