# osac-service-provider, canonical Tier B deployment (REQ-TB-030): its
# SP_OSAC_* env vars point at the real ffs-keycloak/ffs-fulfillment-service
# stack. The retired Phase A mock-provider deployment is intentionally absent.
#
# fulfillment-service's real chart fronts its gRPC server with an envoy
# ingress-proxy that terminates TLS itself (see the chart's
# ingress-proxy/_config.yaml.tpl — "Authentication and authorization are
# handled by the service itself" only describes JWT validation, TLS
# termination is envoy's own job) — osac-sp's own dial is unconditionally
# TLS regardless (DD-229, no insecure fallback exists), and here it also
# needs to trust the same self-signed `osac-ca` CA fulfillment-service's own
# certs are issued from (cert-manager-ca.yaml / DD-151, via
# SP_OSAC_TLS_CERT_FILE), mounted from the `ca-bundle` ConfigMap the
# workflow creates for that chart's own required `certs.caBundle.configMap`
# value.
#
# ffs-keycloak is *also* HTTPS-only now (DD-151 addendum: real
# fulfillment-service rejects a plain-HTTP OIDC issuer). SP_OSAC_TLS_CERT_FILE
# only configures internal/osac's gRPC transport, not the separate plain
# net/http client internal/osac.discoveringTokenSource uses for OIDC
# discovery/token-fetch (it has no CA-override knob at all — a real, narrow
# gap this Tier B run works around rather than fixing in osac-sp's code,
# consistent with "no osac-sp code changes needed" for Phase 1): `command`
# below installs the same CA into the container's system trust store
# (`update-ca-trust`) before starting osac-sp, so that client's default
# `http.Client{}` — which falls back to the OS trust store — accepts it too.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: osac-service-provider
  labels:
    app.kubernetes.io/name: osac-service-provider
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osac-service-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osac-service-provider
    spec:
      containers:
        - name: osac-service-provider
          image: osac-service-provider:e2e
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              cp /etc/osac-ca/bundle.pem /etc/pki/ca-trust/source/anchors/osac-ca.pem
              update-ca-trust extract
              exec ./osac-service-provider
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # "fulfillment-api" is the chart's external-api ingress-proxy
            # Service (port 8000) — the public osac.public.v1.* gRPC
            # surface osac-sp is a legitimate consumer of, as opposed to
            # "fulfillment-internal-api" (administrator/console access).
            - name: SP_OSAC_FULFILLMENT_ADDRESS
              value: "fulfillment-api:8000"
            - name: SP_OSAC_TLS_CERT_FILE
              value: "/etc/osac-ca/bundle.pem"
            - name: SP_OSAC_OIDC_ISSUER_URL
              value: "https://ffs-keycloak:8443/realms/osac"
            - name: SP_OSAC_OIDC_CLIENT_ID
              value: "osac-admin"
            - name: SP_OSAC_OIDC_CLIENT_SECRET
              value: "tierb-osac-admin-secret" # matches tierb-config/realm.json (test-only, NFR-TB-020)
            # Phase 2 (DD-203): registration target migrated from control-plane
            # to the real environment-agent Deployment in this kind cluster.
            - name: DCM_REGISTRATION_URL
              value: "http://environment-agent:8090/api/v1alpha1"
            # Required since M5 merged (same fix as DD-144's Phase A
            # manifest) — osac-sp's config now fails fast without it. NATS is
            # deployed in the same kind cluster.
            - name: DCM_NATS_URL
              value: "nats://nats:4222"
            - name: SP_ENDPOINT
              value: "http://osac-service-provider:8080"
          volumeMounts:
            - name: osac-ca
              mountPath: /etc/osac-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1alpha1/clusters/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1alpha1/clusters/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: osac-ca
          configMap:
            name: ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: osac-service-provider
  labels:
    app.kubernetes.io/name: osac-service-provider
    app.kubernetes.io/part-of: osac-sp-e2e-tierb
spec:
  selector:
    app.kubernetes.io/name: osac-service-provider
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
