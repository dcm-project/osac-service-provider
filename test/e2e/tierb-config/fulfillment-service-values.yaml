# Values for the real, published `oci://ghcr.io/osac-project/charts/fulfillment-service`
# chart (DD-146), installed with `--version` pinned by the workflow
# (REQ-TB-050). Modeled on fulfillment-service/docs/INSTALL.md's own
# example service-values.yaml, adapted for a throwaway `kind` CI cluster:
# - `variant: kind` (the chart's own default; explicit here for clarity)
# - no OpenShift Route/DOMAIN substitution — in-cluster Service DNS names
#   stand in for externalHostname/internalHostname (cert SANs only; nothing
#   resolves them over the network in a kind-only run)
# - auth.issuerUrl / idp.url point at this repo's own ffs-keycloak over
#   HTTPS (osac-ca-issued, see keycloak.yaml) — confirmed via a live spike
#   (DD-146 addendum) that grpc-server hard-rejects a plain-HTTP issuer URL
#   when building its JWKS cache

variant: kind

certs:
  issuerRef:
    kind: ClusterIssuer
    name: osac-ca
  caBundle:
    configMap: ca-bundle

externalHostname: ffs-fulfillment-service.default.svc.cluster.local
internalHostname: ffs-fulfillment-service.default.svc.cluster.local

auth:
  issuerUrl: "https://ffs-keycloak:8443/realms/osac"
  controllerCredentials:
    - secret:
        name: ffs-controller-credentials
        items:
          - key: client-id
            param: client-id
          - key: client-secret
            param: client-secret

idp:
  provider: keycloak
  url: "https://ffs-keycloak:8443"
  credentials:
    - secret:
        name: ffs-controller-credentials
        items:
          - key: client-id
            param: client-id
          - key: client-secret
            param: client-secret

database:
  connection:
    - secret:
        name: ffs-database-credentials
        items:
          - key: url
            param: url
          - key: user
            param: user
          - key: password
            param: password

log:
  level: debug
