# mockprovider-tls-ca (DD-229/REQ-MOCK-140): osac-service-provider's own
# fulfillment-service dial is unconditionally TLS with no insecure
# fallback, so it must trust osac-mock-provider's certificate to dial it in
# this kind cluster. osac-mock-provider's own binary already embeds and
# serves this exact certificate (test/mockprovider/testdata/tls-cert.pem,
# via //go:embed) — this ConfigMap is only how the *other* pod
# (osac-service-provider) gets a copy of it to mount as SP_OSAC_TLS_CERT_FILE.
#
# Not a secret: this is a public certificate (no private key here), and a
# static, checked-in, test-only fixture either way (see
# test/mockprovider/testdata/README.md) — paste its exact contents if it is
# ever regenerated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mockprovider-tls-ca
