# osac-mock-provider (REQ-E2E-030): this repo's own plain manifest, applied
# alongside the sparse-checked-out control-plane chart — not part of that
# chart (it doesn't know about osac-sp/its mock yet). Env vars per
# test/mockprovider/config.go's REQ-MOCK-110 contract.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osac-mock-provider
  labels:
    app.kubernetes.io/name: osac-mock-provider
    app.kubernetes.io/part-of: osac-sp-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osac-mock-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osac-mock-provider
    spec:
      containers:
        - name: osac-mock-provider
          image: osac-mock-provider:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: oidc
              containerPort: 9091
              protocol: TCP
          env:
            - name: MOCK_GRPC_ADDRESS
              value: ":9090"
            - name: MOCK_OIDC_ADDRESS
              value: ":9091"
          readinessProbe:
            tcpSocket:
              port: oidc
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: oidc
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: osac-mock-provider
  labels:
    app.kubernetes.io/name: osac-mock-provider
    app.kubernetes.io/part-of: osac-sp-e2e
spec:
  selector:
    app.kubernetes.io/name: osac-mock-provider
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
    - name: oidc
      port: 9091
      targetPort: oidc
      protocol: TCP
