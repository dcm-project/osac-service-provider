version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  # OSAC's published API service names intentionally omit the `Service`
  # suffix; match upstream's lint exception for the vendored contract.
  except:
    - SERVICE_SUFFIX

breaking:
  use:
    - FILE

deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
  - buf.build/cleanapi/cleanapi:v0.0.12
