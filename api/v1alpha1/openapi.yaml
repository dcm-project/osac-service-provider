openapi: 3.0.4
info:
  title: OSAC Service Provider API
  description: |
    DCM service provider that integrates the Open Sovereign AI Cloud (OSAC)
    platform with DCM, provisioning OpenShift clusters and VMs via OSAC's
    fulfillment service gRPC API.

    **Milestone 3 scope:** Cluster CRUD (Create/Get/List/Delete) is now
    defined. VM CRUD paths are added in a later milestone per issue #1's
    suggested delivery milestones.

    Per Milestone 3's DD-080, `control-plane` (Phase 1) only ever calls
    Create and Delete on this SP's registered endpoint — Get/List/Update
    are served entirely from `control-plane`'s own store and never reach
    this SP. All four operations are still defined here for API-contract
    completeness and any direct/non-`control-plane` caller.

    There are two health endpoints, not one, because this SP registers two
    independent providers with the environment agent — `cluster` at
    `{endpoint}/api/v1alpha1/clusters` and `vm` at
    `{endpoint}/api/v1alpha1/vms` — and the agent health-checks each
    registered provider at `{endpoint}/health` (see DD-010 in the Milestone 1
    spec). Both endpoints report the same underlying OIDC/OSAC health.
  version: 1.0.0
  contact:
    name: DCM Project
    url: https://github.com/dcm-project/osac-service-provider
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /
    description: OSAC Service Provider

tags:
  - name: Clusters
    description: Cluster management operations
  - name: Health
    description: Health check operations

paths:
  /api/v1alpha1/clusters:
    post:
      summary: Create a cluster
      description: |
        Creates a new OSAC-backed OpenShift cluster. `control-plane`
        dispatches this with the resource `id` as a query parameter (its
        own generated identifier) and a body containing only `spec`
        (DD-080) — the request body schema is this same `Cluster` resource
        type (AEP-133-compliant, DD-113), but `spec` is its only field
        `control-plane` ever actually populates on the wire; every other
        `Cluster` field is absent from that request and simply unmarshals
        to its zero value, which this handler ignores. Idempotent on `id`:
        a retry with the same `id` returns the existing cluster's current
        state rather than an error (REQ-CREATE-040/DD-100).
      operationId: createCluster
      tags:
        - Clusters
      parameters:
        - name: id
          in: query
          description: >-
            Caller-assigned resource identifier, set as OSAC's own
            `Cluster.id` (REQ-CREATE-020). Schema-optional per AEP-133 ("a
            create operation must not have any required parameters other
            than path parameters" — DD-113); REQ-CREATE-010/060 still make
            it a hard runtime requirement, enforced by request validation
            (400 if absent/empty) rather than this field's own `required`
            flag, since control-plane always supplies it and this SP does
            not auto-generate ids.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cluster'
      responses:
        '201':
          description: Cluster created (or, if `id` already existed, its current state — REQ-CREATE-040).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          description: Missing `id` or a required `spec` field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: OSAC fulfillment service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: List clusters
      description: |
        Returns a paginated list of clusters owned by this SP (filtered by
        the `dcm.io/managed-by=dcm` ownership label — REQ-LIST-010). Never
        populates `kubeconfig` on any entry (REQ-LIST-030).
      operationId: listClusters
      tags:
        - Clusters
      parameters:
        - name: page_token
          in: query
          description: Opaque pagination token from a previous response's `next_page_token`.
          required: false
          schema:
            type: string
        - name: max_page_size
          in: query
          description: Maximum number of results to return per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: List of clusters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: OSAC fulfillment service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1alpha1/clusters/{clusterId}:
    get:
      summary: Get cluster details
      description: |
        Returns the cluster's current status. `kubeconfig` is populated
        only when the mapped status is exactly `ACTIVE` (REQ-GET-020/030).
      operationId: getCluster
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/ClusterIdPath'
      responses:
        '200':
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cluster not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: OSAC fulfillment service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a cluster
      description: |
        Deletes a cluster. Returns as soon as OSAC acknowledges the
        request — does not poll for the cluster to actually disappear
        (REQ-DELETE-040). A `NotFound` from OSAC (already deleted) is
        treated as success (`204`), mirroring `control-plane`'s own
        tolerance for this exact case (REQ-DELETE-020/DD-080) — this
        endpoint therefore never returns `404`.
      operationId: deleteCluster
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/ClusterIdPath'
      responses:
        '204':
          description: Cluster deleted (or already absent)
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: OSAC fulfillment service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1alpha1/clusters/health:
    get:
      summary: Cluster Provider Health Check
      description: |
        Returns the health status of the service provider's `cluster`
        registration, reflecting real OSAC gRPC connectivity and OIDC token
        validity. Reports the same status as `/api/v1alpha1/vms/health` —
        this SP's health is a single, global condition (see DD-010 in the
        Milestone 1 spec).
      operationId: getClustersHealth
      tags:
        - Health
      responses:
        '200':
          description: |
            Health check completed. The `status` field, not the HTTP status
            code, indicates whether the SP is healthy — an unhealthy SP still
            returns 200 (see SC-002 in the spec).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: Internal server error (e.g. an unexpected panic).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1alpha1/vms/health:
    get:
      summary: VM Provider Health Check
      description: |
        Returns the health status of the service provider's `vm`
        registration, reflecting real OSAC gRPC connectivity and OIDC token
        validity. Reports the same status as
        `/api/v1alpha1/clusters/health` — this SP's health is a single,
        global condition (see DD-010 in the Milestone 1 spec).
      operationId: getVMsHealth
      tags:
        - Health
      responses:
        '200':
          description: |
            Health check completed. The `status` field, not the HTTP status
            code, indicates whether the SP is healthy — an unhealthy SP still
            returns 200 (see SC-002 in the spec).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: Internal server error (e.g. an unexpected panic).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    ClusterIdPath:
      name: clusterId
      in: path
      required: true
      description: DCM-level cluster resource identifier (same value as OSAC's `Cluster.id` — DD-080's ID Mapping note).
      schema:
        type: string

  schemas:
    ClusterSpec:
      type: object
      description: Service-type-specific input specification for a cluster (Kubernetes Cluster generic schema).
      required:
        - version
        - nodes
        - metadata
        - provider_hints
      properties:
        version:
          type: string
          description: >-
            Kubernetes minor version (e.g. "1.30"). Translated internally
            to an OSAC `release_image` via a hardcoded placeholder table
            (REQ-CREATE-025) unless `provider_hints.osac.release_image`
            overrides it. Echoed back verbatim on the Create response only
            — Get/List omit it (SC-M3-002).
          example: "1.30"
        nodes:
          $ref: '#/components/schemas/ClusterNodes'
        metadata:
          $ref: '#/components/schemas/ClusterMetadata'
        provider_hints:
          $ref: '#/components/schemas/ClusterProviderHints'

    ClusterNodes:
      type: object
      description: >-
        Node configuration for the cluster. No `control_plane` bucket:
        OSAC's Hosted Control Planes manage the control plane internally,
        so the generic schema's `nodes.control_plane` has no corresponding
        OSAC field and is not sent (see M3 spec §4.1 Field Mapping).
      required:
        - worker
      properties:
        worker:
          $ref: '#/components/schemas/ClusterWorkerNodes'

    ClusterWorkerNodes:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: Number of worker nodes. Mapped to OSAC's `spec.node_sets[key].size`.
          minimum: 1
        cpu:
          type: integer
          description: >-
            Informational only (REQ-CREATE-070) — `host_type` is fixed by
            the template; the SP never derives an OSAC field from this.
        memory:
          type: string
          description: Informational only (REQ-CREATE-070). E.g. "32GB".
        storage:
          type: string
          description: Informational only (REQ-CREATE-070). E.g. "250GB".

    ClusterMetadata:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable cluster name. Mapped to OSAC's `spec.metadata.name`.
        labels:
          type: object
          description: >-
            Merged with (not replaced by) the three `dcm.io/*` ownership
            labels the SP always sets (REQ-CREATE-030).
          additionalProperties:
            type: string

    ClusterProviderHints:
      type: object
      required:
        - osac
      properties:
        osac:
          $ref: '#/components/schemas/OSACProviderHints'

    OSACProviderHints:
      type: object
      required:
        - template_id
      properties:
        template_id:
          type: string
          description: Reference to the OSAC cluster template. Mapped to OSAC's `spec.template`.
        base_domain:
          type: string
          description: Optional passthrough to OSAC's `spec.network.*`.
        pull_secret:
          type: string
          writeOnly: true
          description: Optional passthrough to OSAC's `spec.pull_secret`. Write-only.
        ssh_key:
          type: string
          description: Optional passthrough to OSAC's `spec.ssh_public_key`.
        release_image:
          type: string
          description: >-
            Optional override for the `version`-derived `release_image`
            translation (REQ-CREATE-025).

    Cluster:
      type: object
      description: A cluster resource managed by OSAC.
      x-aep-resource:
        singular: cluster
        plural: clusters
        type: osac-service-provider.dcm.io/cluster
        patterns:
          - clusters/{cluster}
      required:
        - id
        - status
      properties:
        id:
          type: string
          readOnly: true
          description: Same value as OSAC's `Cluster.id` (DD-080's ID Mapping note).
        path:
          type: string
          readOnly: true
          description: Resource path for this cluster
          example: clusters/123e4567-e89b-12d3-a456-426614174000
        status:
          $ref: '#/components/schemas/ClusterStatus'
        status_message:
          type: string
          readOnly: true
          description: Human-readable message about the current status
        spec:
          description: >-
            Request-only (DD-113): present when this schema is used as the
            Create request body (`POST /clusters`'s AEP-133-compliant
            request body, which is this same `Cluster` resource type).
            Never populated in a Get/List response — control-plane's own
            actual wire dispatch still sends only `{"spec": {...}}` in the
            body, so this remains the only body field it ever sets.
          allOf:
            - $ref: '#/components/schemas/ClusterSpec'
        version:
          type: string
          readOnly: true
          description: >-
            Echoed from the Create request's `spec.version`. Create
            response only — omitted on Get/List (SC-M3-002).
        kubeconfig:
          type: string
          readOnly: true
          description: >-
            Base64-encoded kubeconfig. Populated only when `status` is
            exactly `ACTIVE` (REQ-GET-020/030); always empty on List
            entries (REQ-LIST-030).
        node_sets:
          type: object
          readOnly: true
          description: >-
            Echoes OSAC's `status.node_sets` map directly — no
            `ready`/`total` computation, since OSAC's `ClusterNodeSet` has
            no such field (SC-M3-002).
          additionalProperties:
            $ref: '#/components/schemas/ClusterNodeSet'
        create_time:
          type: string
          format: date-time
          readOnly: true
        update_time:
          type: string
          format: date-time
          readOnly: true

    ClusterNodeSet:
      type: object
      description: Mirrors OSAC's `ClusterNodeSet` (`host_type`, `size`) — see SC-M3-002.
      properties:
        host_type:
          type: string
        size:
          type: integer

    ClusterStatus:
      type: string
      description: >-
        DCM's full canonical 7-value Cluster status vocabulary (DD-090) —
        not the 5-value subset in the osac-sp enhancement doc's own
        Status Mapping table.
      enum:
        - PROGRESSING
        - ACTIVE
        - DEGRADED
        - UNAVAILABLE
        - FAILED
        - DELETING
        - DELETED

    ClusterList:
      type: object
      description: AEP-132 pagination wrapper.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        next_page_token:
          type: string
          description: >-
            Empty/absent exactly when there are no further results
            (REQ-LIST-040).

    Health:
      type: object
      description: Health status singleton resource
      x-aep-resource:
        singular: health
        plural: healths
        singleton: true
        type: osac-service-provider.dcm.io/health
        patterns:
          - health
      required:
        - type
        - status
        - path
        - version
        - uptime
      properties:
        type:
          type: string
          format: uri-reference
          readOnly: true
          description: Resource type identifier
          example: "osac-service-provider.dcm.io/health"
        status:
          type: string
          description: Health status
          enum:
            - healthy
            - unhealthy
          example: "healthy"
        path:
          type: string
          readOnly: true
          description: Canonical path of the resource
          example: "health"
        version:
          type: string
          readOnly: true
          description: Service provider build version
          example: "0.0.1-dev"
        uptime:
          type: integer
          readOnly: true
          description: Seconds since the service provider started
          example: 3600
        detail:
          type: string
          readOnly: true
          description: |
            When unhealthy, distinguishes the cause (token invalid vs. OSAC
            unreachable — both may be true simultaneously). Absent when
            healthy.
          example: "OIDC token invalid; OSAC fulfillment service unreachable"

    Error:
      type: object
      description: RFC 9457 compliant error response (Problem Details for HTTP APIs)
      externalDocs:
        description: "RFC 9457: Problem Details for HTTP APIs"
        url: https://datatracker.ietf.org/doc/html/rfc9457
      required:
        - type
        - title
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            URI reference identifying the error type. Uses the DCM
            project-controlled https://dcm-project.github.io/problems/*
            namespace, matching the ecosystem's RFC 9457 migration (see
            acm-cluster-service-provider and k8s-container-service-provider).
          enum:
            - https://dcm-project.github.io/problems/invalid-argument
            - https://dcm-project.github.io/problems/not-found
            - https://dcm-project.github.io/problems/already-exists
            - https://dcm-project.github.io/problems/permission-denied
            - https://dcm-project.github.io/problems/unauthenticated
            - https://dcm-project.github.io/problems/internal
            - https://dcm-project.github.io/problems/unavailable
          x-enum-varnames:
            - INVALIDARGUMENT
            - NOTFOUND
            - ALREADYEXISTS
            - PERMISSIONDENIED
            - UNAUTHENTICATED
            - INTERNAL
            - UNAVAILABLE
        title:
          type: string
          description: Short human-readable summary
        status:
          type: integer
          format: int32
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri-reference
          description: URI reference for this specific error occurrence
