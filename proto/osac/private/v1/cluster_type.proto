syntax = "proto3";

package osac.private.v1;

import "osac/private/v1/metadata_type.proto";
import "osac/private/v1/secret_type.proto";

// Minimal wire-compatible Cluster shape needed by the Tier B fixture to
// seed an ACTIVE cluster's kubeconfig Secret reference through the private
// API. Fields not needed by this client subset remain unknown fields and are
// preserved by protobuf decoding/encoding.
message Cluster {
  string id = 1;
  Metadata metadata = 2;
  ClusterStatus status = 4;
}

enum ClusterState {
  CLUSTER_STATE_UNSPECIFIED = 0;
  CLUSTER_STATE_PROGRESSING = 1;
  CLUSTER_STATE_READY = 2;
  CLUSTER_STATE_FAILED = 3;
  CLUSTER_STATE_DELETING = 4;
  CLUSTER_STATE_DELETE_FAILED = 5;
}

message ClusterStatus {
  ClusterState state = 1;
  SecretLocalReference kubeconfig_secret = 9;
  SecretLocalReference password_secret = 10;
}
