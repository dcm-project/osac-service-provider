syntax = "proto3";

package osac.private.v1;

import "osac/private/v1/metadata_type.proto";
import "osac/private/v1/secret_type.proto";

// Minimal wire-compatible Tenant shape used by the Tier B fixture to create
// a tenant-scoped Secret for the real Cluster Get flow.
message Tenant {
  string id = 1;
  Metadata metadata = 2;
  TenantSpec spec = 3;
  TenantStatus status = 4;
}

message TenantSpec {
  repeated string domains = 1;
  SecretLocalReference break_glass_credentials_secret = 2;
}

message TenantStatus {
  TenantState state = 2;
}

enum TenantState {
  TENANT_STATE_UNSPECIFIED = 0;
  TENANT_STATE_PENDING = 1;
  TENANT_STATE_SYNCED = 2;
  TENANT_STATE_FAILED = 3;
}
