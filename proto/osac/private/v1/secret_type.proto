syntax = "proto3";

package osac.private.v1;

import "buf/validate/validate.proto";
import "cleanapi/cleanapi.proto";
import "osac/private/v1/metadata_type.proto";

option (cleanapi.file).package = "osac.public.v1";

// Represents a secret containing typed or opaque key-value data.
//
// Secrets store sensitive information such as TLS certificates, pull secrets,
// and credentials. Each secret holds a map of named binary values.
//
// Secrets are scoped to a tenant and can be referenced by other resources
// that require sensitive configuration data.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message Secret {
  string id = 1;
  Metadata metadata = 2;
  map<string, bytes> data = 3 [(buf.validate.field).map = {
    keys: {
      string: {min_len: 1}
    }
  }];
  SecretBackend backend = 4 [(cleanapi.field).private = true];
  map<string, string> coordinates = 5 [(cleanapi.field).private = true];
  SecretType type = 6 [(buf.validate.field).enum.defined_only = true];
}

// The type of data stored in the secret.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_PULL_SECRET = 1;
  SECRET_TYPE_KUBECONFIG = 2;
  SECRET_TYPE_USER_DATA = 3;
  SECRET_TYPE_OPAQUE = 4;
  SECRET_TYPE_VALUE = 5;
}

// Storage backends for secrets.
enum SecretBackend {
  option (cleanapi.enum).private = true;
  SECRET_BACKEND_UNSPECIFIED = 0;
  SECRET_BACKEND_VAULT = 1;
  SECRET_BACKEND_HUB = 2;
}

// Local reference to a Secret resource.
message SecretLocalReference {
  string id = 1;
  string name = 2;
}
