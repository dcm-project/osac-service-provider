syntax = "proto3";

package osac.private.v1;

import "google/protobuf/field_mask.proto";
import "osac/private/v1/cluster_type.proto";

// Minimal wire-compatible Get/Update subset used by the Tier B test fixture
// to create a kubeconfig Secret reference on a real Fulfillment Service
// Cluster. The production provider only calls the public Clusters API.
message ClustersGetRequest {
  string id = 1;
}

message ClustersGetResponse {
  Cluster object = 1;
}

message ClustersUpdateRequest {
  Cluster object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message ClustersUpdateResponse {
  Cluster object = 1;
}

service Clusters {
  rpc Get(ClustersGetRequest) returns (ClustersGetResponse) {}
  rpc Update(ClustersUpdateRequest) returns (ClustersUpdateResponse) {}
}
