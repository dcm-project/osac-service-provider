syntax = "proto3";

package osac.private.v1;

import "osac/private/v1/tenant_type.proto";

// Minimal wire-compatible Create request used to prepare the Tier B test
// tenant required for a non-shared test Secret.
message TenantsCreateRequest {
  Tenant object = 1;
}

message TenantsCreateResponse {
  Tenant object = 1;
}

message TenantsGetRequest {
  string id = 1;
}

message TenantsGetResponse {
  Tenant object = 1;
}

service Tenants {
  rpc Create(TenantsCreateRequest) returns (TenantsCreateResponse) {}
  rpc Get(TenantsGetRequest) returns (TenantsGetResponse) {}
}
